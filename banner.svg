<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.33" stop-color="#22d3ee"/>
      <stop offset="0.66" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <g filter="url(#blur)" opacity="0.75">
      <circle cx="200" cy="80" r="160" fill="#10b981">
        <animate attributeName="cx" values="200;420;200" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="80;220;80" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1000" cy="240" r="170" fill="#7c3aed">
        <animate attributeName="cx" values="1000;760;1000" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="240;90;240" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="300" r="140" fill="#06b6d4">
        <animate attributeName="cx" values="620;840;460;620" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect width="1200" height="320" fill="url(#grid)"/>

    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
      <text x="600" y="165" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#name)" filter="url(#glow)">Motoki Saito</text>
      <text x="600" y="225" font-size="24" font-weight="500" letter-spacing="6" fill="#e5e7eb" fill-opacity="0.85">FULL-STACK ENGINEER</text>
      <text x="600" y="262" font-size="18" fill="#9ca3af">
        <tspan>Nuxt · React · Hono · AWS · Terraform</tspan>
        <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
