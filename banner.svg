<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030406"/>
      <stop offset="1" stop-color="#07090f"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#5e9c86"/>
      <stop offset="0.33" stop-color="#5b8fa3"/>
      <stop offset="0.66" stop-color="#7e74a8"/>
      <stop offset="1" stop-color="#5e9c86"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <g filter="url(#blur)" opacity="0.22">
      <circle cx="220" cy="90" r="150" fill="#0f766e">
        <animate attributeName="cx" values="220;420;220" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="90;220;90" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="230" r="160" fill="#4c1d95">
        <animate attributeName="cx" values="980;760;980" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="230;100;230" dur="22s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="300" r="130" fill="#155e75">
        <animate attributeName="cx" values="620;820;460;620" dur="26s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#vignette)"/>

    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
      <text x="600" y="165" font-size="88" font-weight="800" letter-spacing="-2" fill="url(#name)">Motoki Saito</text>
      <text x="600" y="222" font-size="20" font-weight="500" letter-spacing="8" fill="#9ca3af">FULL-STACK ENGINEER</text>
      <text x="600" y="258" font-size="16" fill="#6b7280">Nuxt · React · Hono · AWS · Terraform</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
  </g>
</svg>
